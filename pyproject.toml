[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ecogdecode"
version = "0.1.0"
description = "Causal, streaming decoding of individual finger flexion from human ECoG (BCI Competition IV, data set 4)"
readme = "README.md"
license = { text = "MIT" }
authors = [{ name = "Andreea Luiza Marin" }]
requires-python = ">=3.10"
dependencies = [
    "numpy>=1.24",
    "scipy>=1.10",
    "torch>=2.2",
    "matplotlib>=3.7",
    "h5py>=3.8",
    "scikit-learn>=1.3",
    "shapely>=2.0",
]

[project.optional-dependencies]
onnx = ["onnx>=1.15", "onnxruntime>=1.17"]
dev = ["pytest>=7", "onnx>=1.15", "onnxruntime>=1.17"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 120

[tool.ruff.lint]
select = ["F", "E9", "B"]
ignore = ["B905"]
